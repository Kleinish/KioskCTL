name: Release
on:
  push:
    tags: ['v*']
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.88.0', targets: '${{ matrix.target }}' }
      - run: cargo build --release --target '${{ matrix.target }}'
      - run: install -D "target/${{ matrix.target }}/release/kioskctl" "dist/kioskctl-${{ matrix.target }}" && sha256sum dist/kioskctl-* > "dist/SHA256SUMS-${{ matrix.target }}"
      - uses: softprops/action-gh-release@v2
        with: { files: 'dist/*' }
